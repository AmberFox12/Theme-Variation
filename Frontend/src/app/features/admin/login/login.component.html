<div class="login-page">
  <div class="login-carte">
    <div class="login-entete">
      <span class="login-titre">Thème et Variations</span>
      <span class="login-sous-titre">Espace administration</span>
    </div>

    <div class="login-corps">
      <h1>Connexion</h1>

      @if (errorMessage()) {
        <div class="alerte-erreur">{{ errorMessage() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="champ">
          <label for="email">Adresse email</label>
          <input id="email" type="email" formControlName="email" placeholder="admin@exemple.fr" autocomplete="email" />
        </div>

        <div class="champ">
          <label for="motDePasse">Mot de passe</label>
          <input id="motDePasse" type="password" formControlName="motDePasse" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <button type="submit" class="btn-connexion" [disabled]="formStatus() !== 'VALID'">
          Se connecter
        </button>
      </form>
    </div>
  </div>
</div>
