<div class="page-entete">
  <h1>Gestion des utilisateurs</h1>
</div>

<div class="tableau-carte">
  <table class="tableau">
    <thead>
      <tr>
        <th>Nom</th>
        <th>Email</th>
        <th>Téléphone</th>
        <th>Rôle</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (compte of comptes(); track compte.id) {
        <tr>
          <td>{{ compte.prenom }} {{ compte.nom }}</td>
          <td>{{ compte.email }}</td>
          <td>{{ compte.telephone ?? '—' }}</td>
          <td>
            <span class="badge" [class.badge-admin]="compte.role === 'ADMIN'" [class.badge-eleve]="compte.role === 'ELEVE'">
              {{ compte.role }}
            </span>
          </td>
          <td class="td-actions">
            @if (compte.email !== monEmail) {
              <button class="btn-role" [class.btn-retirer]="compte.role === 'ADMIN'" (click)="changerRole(compte)">
                {{ compte.role === 'ADMIN' ? 'Retirer admin' : 'Rendre admin' }}
              </button>
              <button class="btn-supprimer" (click)="supprimer(compte)" title="Supprimer ce compte">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                  <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                </svg>
              </button>
            } @else {
              <span class="vous">(vous)</span>
            }
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
