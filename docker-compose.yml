services:
  postgres:
    image: postgres:16
    container_name: themevariation-db
    environment:
      POSTGRES_DB: themevariation
      POSTGRES_USER: tvuser
      POSTGRES_PASSWORD: tvpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
